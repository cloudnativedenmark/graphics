<!--
  Generic statement content layer: name, role, and a pull statement.
  Used by every category the designer shipped, since all four share this
  structure. A category only needs its own template if it departs from it. Injected into _social-frame.svg,
  already clipped to the window, so it may draw edge to edge.

  Slots
    photo      image path; optional. v1 expects a full-bleed stage shot,
               v2/v3 a portrait that sits inside the card.
    name       speaker name
    role       role and organisation, e.g. "PLATFORM LEAD, JYSK"
    highlight  the pull statement. Split lines with "|" — a human choosing
               where a hero line breaks beats greedy wrapping every time.
    portrait   headshot for the v2/v3 card layouts, clipped to either the
               brand silhouette or a circle.

  Positions and sizes come from geometry.json content.{1,2}, which is why v1
  text sits low over the photo and v2/v3 text sits right of the portrait.
-->

{{photoLayer}}

{{portraitLayer}}

<text font-family="Space Grotesk" font-weight="500" text-transform="uppercase">
  <tspan x="{{nameX}}" y="{{nameY}}"
         font-size="{{nameSize}}" letter-spacing="{{nameTracking}}"
         fill="{{nameColor}}">{{name}}</tspan>

  <tspan x="{{roleX}}" y="{{roleY}}"
         font-size="{{roleSize}}" letter-spacing="{{roleTracking}}"
         fill="{{roleColor}}">{{role}}</tspan>
</text>

<text font-family="Space Grotesk" font-weight="500"
      font-size="{{highlightSize}}" letter-spacing="{{highlightTracking}}"
      fill="{{highlightColor}}">{{highlightLines}}</text>
